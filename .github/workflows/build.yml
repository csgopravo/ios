name: Build iOS App

on:
  push:
    branches:
      - main # or your main branch name
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: macos-latest # Requires a macOS runner to build iOS

    steps:
    - name: Checkout code
      uses: actions/checkout@v4 # Updated to v4

    - name: Set up Node.js
      uses: actions/setup-node@v4 # Updated to v4
      with:
        node-version: '18.x' # Or your preferred Node.js version

    - name: Install dependencies
      run: npm install -g cordova # Install Cordova globally

    - name: Add iOS platform
      run: |
        cordova platform add ios
        cordova plugin add cordova-plugin-file # Add other plugins
        cordova plugin add cordova-plugin-splashscreen
        cordova plugin add cordova-plugin-ionic-webview

    - name: Set up code signing
      uses: apple-actions/import-codesign-certs@v1
      with:
        certificate-content: ${{ secrets.IOS_CERTIFICATE }} # Base64 encoded .p12
        certificate-password: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
        provisioning-profile-content: ${{ secrets.IOS_PROVISIONING_PROFILE }} # Base64 encoded mobileprovision
        keychain-password: ${{ secrets.KEYCHAIN_PASSWORD }} # Keychain password (can be same as certificate password)

    - name: Build iOS app
      run: |
        cordova build ios --release
    
    - name: Upload IPA
      uses: actions/upload-artifact@v4 # Updated to v4
      with:
        name: ios-app
        path: platforms/ios/build/device/*.ipa
