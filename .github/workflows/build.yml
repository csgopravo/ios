name: Build iOS App

on:
  push:
    branches:
      - main # or your main branch name
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: macos-latest # Requires a macOS runner to build iOS

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18.x' # Or your preferred Node.js version

    - name: Install dependencies
      run: npm install -g cordova # Install Cordova globally

    - name: Add iOS platform and update cordova-ios
      run: |
        cordova platform add ios
        cordova platform update ios # Ensure latest cordova-ios

    - name: Install Cordova plugins
      run: |
        cordova plugin add cordova-plugin-file # Add other plugins
        cordova plugin add cordova-plugin-splashscreen
        cordova plugin add cordova-plugin-ionic-webview
        cordova plugin add cordova-plugin-inappbrowser # Example plugin

    - name: Build iOS app
      run: |
        cordova build ios --debug --buildConfig build.json # Use build.json
    
    - name: Upload IPA
      uses: actions/upload-artifact@v4
      with:
        name: ios-app
        path: platforms/ios/build/device/*.ipa
